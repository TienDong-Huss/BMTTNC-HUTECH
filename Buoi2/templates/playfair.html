<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playfair Cipher</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.4.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #007bff;
        }
        h3 {
            margin-top: 30px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #343a40;
        }
        .btn {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 5px;
        }
        .btn-outline-primary {
            border: 2px solid #007bff;
            color: #007bff;
        }
        .btn-outline-primary:hover {
            background-color: #007bff;
            color: white;
        }
        .btn-outline-success {
            border: 2px solid #28a745;
            color: #28a745;
        }
        .btn-outline-success:hover {
            background-color: #28a745;
            color: white;
        }
        .form-label {
            font-weight: bold;
        }
        .mb-4 {
            margin-bottom: 30px;
        }
        .form-control {
            border-radius: 5px;
            padding: 10px;
        }
        .cipher-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 15px;
            background: #ffffff;
            border: none;
        }
        .cipher-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container form-container">
        <h2 class="mb-4 text-center">Playfair Cipher</h2>

        <!-- Form mã hóa -->
        <form action="" method="post" class="mb-4">
            <h3>Mã hóa</h3>
            <div class="mb-3">
                <label for="plain_text_encrypt" class="form-label">Văn bản gốc:</label>
                <input type="text" class="form-control" id="plain_text_encrypt" name="plain_text" placeholder="Nhập văn bản cần mã hóa" required>
            </div>
            <div class="mb-3">
                <label for="key_encrypt" class="form-label">Khóa:</label>
                <input type="text" class="form-control" id="key_encrypt" name="key" placeholder="Nhập khóa" required>
            </div>
            <button type="submit" name="encrypt" class="btn btn-outline-primary">Mã hóa</button>
        </form>

        <hr />

        <!-- Form giải mã -->
        <form action="" method="post">
            <h3>Giải mã</h3>
            <div class="mb-3">
                <label for="cipher_text_decrypt" class="form-label">Văn bản mã hóa:</label>
                <input type="text" class="form-control" id="cipher_text_decrypt" name="cipher_text" placeholder="Nhập văn bản mã hóa" required>
            </div>
            <div class="mb-3">
                <label for="key_decrypt" class="form-label">Khóa:</label>
                <input type="text" class="form-control" id="key_decrypt" name="key" placeholder="Nhập khóa" required>
            </div>
            <button type="submit" name="decrypt" class="btn btn-outline-success">Giải mã</button>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.4.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
